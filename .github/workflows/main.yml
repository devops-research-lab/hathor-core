name: tests
on:
  push: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
    - id: set-matrix
      shell: python
      run: "import os\nimport json\nfull_matrix = {\n  'python': ['3.10', '3.11', '3.12'],\n  # available\
        \ OS's: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idruns-on\n\
        \  'os': ['ubuntu-22.04', 'macos-13'],\n}\n# this is the fastest one:\nreduced_matrix = {\n  'python':\
        \ ['3.12'],\n  'os': ['ubuntu-22.04'],\n}\ngithub_repository = os.environ['GITHUB_REPOSITORY']\n\
        if github_repository.lower() == 'hathornetwork/hathor-core':\n    matrix = full_matrix\nelse:\n\
        \    matrix = reduced_matrix\nwith open(os.environ['GITHUB_OUTPUT'], 'a') as f:\n  f.write('matrix={}\\\
        n'.format(json.dumps(matrix)))\n"
  check-matrix:
    runs-on: ubuntu-latest
    needs: matrix
    steps:
    - name: Install json2yaml
      run: 'sudo npm install -g json2yaml

        '
    - name: Check matrix definition
      run: 'matrix=''${{ needs.matrix.outputs.matrix }}''

        echo $matrix

        echo $matrix | jq .

        echo $matrix | json2yaml

        '
  test:
    name: python-${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: matrix
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.matrix.outputs.matrix)}}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - uses: ./.github/actions/setup-hathor-env
      name: Setup Hathor node environment
      with:
        python: ${{ matrix.python }}
        os: ${{ matrix.os }}
    - name: Cache mypy
      uses: actions/cache@v4
      with:
        path: .mypy_cache
        key: ${{ runner.os }}-py${{ matrix.python }}-mypy-${{ github.head_ref || github.ref }}
        restore-keys: '${{ runner.os }}-py${{ matrix.python }}-mypy-refs/heads/dev-

          ${{ runner.os }}-py${{ matrix.python }}-mypy-

          '
    - name: Run linters
      run: poetry run make check
    - name: Run tests
      run: poetry run make tests
    - name: Upload coverage
      uses: codecov/codecov-action@v4
      if: matrix.python == 3.11 && startsWith(matrix.os, 'ubuntu')
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
